[project]
name = "orion-alert-triage"
version = "0.1.0"
description = "ORION: multi-tool orchestration for KYC/AML alert triage with a dynamic tool registry, credibility scoring, permission scoping, and conflict resolution."
authors = [{ name = "Ash", email = "AshraHossain@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.34",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

# Ruff configuration for ORION.
#
# Adapted from AI_Engineering_Cockpit/config/ruff.toml, which this project grew
# out of. Two differences: it lives at the repo root here (so a bare
# `uv run ruff check .` picks it up), and the cockpit-only excludes
# (projects/, templates/) and isort first-party setting are gone.

target-version = "py311"
line-length = 100
indent-width = 4

extend-exclude = [
    ".venv",
    "venv",
    "build",
    "dist",
    "*.egg-info",
    "htmlcov",
    ".mypy_cache",
    ".ruff_cache",
    ".pytest_cache",
    "outputs",
]

[lint]
# Comprehensive but not pedantic: catch real bugs, security issues, and
# maintainability smells without fighting the formatter or demanding
# docstring perfection everywhere.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (undefined names, unused imports, etc.)
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade (modern Python idioms)
    "B",    # flake8-bugbear (likely bugs / design smells)
    "A",    # flake8-builtins (shadowing builtins)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "PIE",  # flake8-pie (misc lints)
    "RET",  # flake8-return
    "T20",  # flake8-print (no print(), use logging)
    "S",    # flake8-bandit (security lints)
    "ARG",  # flake8-unused-arguments
    "PERF", # perflint
    "RUF",  # ruff-specific rules
]

ignore = [
    "E501",   # line length is handled by the formatter; avoid double-reporting
    "S101",   # assert is fine and expected in tests
    "PTH123", # open() vs Path.open() -- not worth enforcing project-wide yet
]

# Tests get a lighter touch: asserts, occasional unused fixture args, and
# security lints that are noisy on fixture/mock data are all expected there.
[lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG001", "ARG002", "S105", "S106"]
"**/conftest.py" = ["ARG001"]

[lint.pydocstyle]
convention = "google"

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
